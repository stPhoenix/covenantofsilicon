# Trivy Configuration for Python/Django Projects
# Used by: trivy-core.sh --config trivy-python.conf

# === Project Identification ===
PROJECT_NAME="Pletyvo Backend"

# === Scan Settings ===
SCAN_PATH="."
TRIVY_VERSION="latest"

# === Scanner Function (Required by trivy-core.sh) ===
run_scan() {
    docker run --rm \
        -v "$(pwd):/app" \
        -w /app \
        "aquasec/trivy:$TRIVY_VERSION" \
        fs \
        --format json \
        --output "$REPORT_OUTPUT_DIR/trivy-scan.json" \
        --scanners vuln,secret,misconfig \
        --severity CRITICAL,HIGH,MEDIUM,LOW \
        --skip-dirs "__pycache__,.venv,.git,htmlcov,.pytest_cache,node_modules,.scannerwork" \
        --skip-files "*.pyc,*.pyo" \
        "$SCAN_PATH"
}

# === Optional: Override defaults ===
# TRIVY_VERSION="0.50.0"
# REPORT_OUTPUT_DIR="examples"
