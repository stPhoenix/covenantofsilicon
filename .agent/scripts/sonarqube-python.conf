# SonarQube Configuration for Python/Django Projects
# Used by: sonarqube-core.sh --config sonarqube-python.conf

# === Project Identification ===
PROJECT_KEY="pletyvo"
PROJECT_NAME="Pletyvo Backend"
SOURCE_DIR="src/pletyvo"

# === Python-Specific Settings ===
PYTHON_VERSION="3.14"

# === Scanner Function (Required by sonarqube-core.sh) ===
run_scanner() {
    # Use sonar.login for compatibility with SonarQube 9.x LTS
    local auth_arg=""
    if [ -n "$SONAR_TOKEN" ]; then
        auth_arg="-Dsonar.login=$SONAR_TOKEN"
    else
        auth_arg="-Dsonar.login=admin -Dsonar.password=admin"
    fi

    # Create local scannerwork directory for report-task.txt
    mkdir -p .scannerwork

    docker run --rm --network host \
        -v "$(pwd):/usr/src" \
        -v "$(pwd)/.scannerwork:/usr/src/.scannerwork" \
        -w /usr/src \
        sonarsource/sonar-scanner-cli:latest \
        -Dsonar.projectKey="$PROJECT_KEY" \
        -Dsonar.projectName="$PROJECT_NAME" \
        -Dsonar.sources="$SOURCE_DIR" \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        "$auth_arg" \
        -Dsonar.python.version="$PYTHON_VERSION" \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.working.directory=/usr/src/.scannerwork \
        -Dsonar.exclusions="**/migrations/**,**/__pycache__/**,**/tests/**,**/*.pyc" \
        -Dsonar.test.inclusions="**/tests/**,**/*_test.py,**/test_*.py"
}

# === Optional: Override defaults ===
# SONAR_VERSION="lts-community"
# REPORT_OUTPUT_DIR="examples"
# MAX_WAIT_SECONDS=600
